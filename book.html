<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Ride | Rider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/booking.css" />
    <script type="module" src="js/booking.js"></script>
  </head>
  <body class="ride-body">
    <header class="ride-header">
      <div class="container ride-header-inner">
        <a href="index.html" class="brand" aria-label="Rider home page">
          <span class="brand-mark">R</span>
          <span class="brand-text">Rider</span>
        </a>

        <div class="university-picker">
          <label for="university">Select University</label>
          <select id="university" name="university" aria-label="Select university">
            <option value="veritas-university" selected>Veritas University</option>
          </select>
        </div>
      </div>
    </header>

    <main class="container ride-shell">
      <section class="ride-panel" aria-labelledby="ride-title">
        <div class="panel-header">
          <span class="eyebrow accent">Get a ride</span>
          <h1 id="ride-title">Get a ride with:</h1>
        </div>

        <div class="ride-options" role="radiogroup" aria-label="Ride options">
          <label class="ride-option active">
            <input type="radio" name="ride-type" value="keke" checked />
            <span class="option-label">Keke</span>
          </label>

          <label class="ride-option disabled">
            <input type="radio" name="ride-type" value="bike" disabled />
            <span class="option-label">Bike</span>
            <span class="coming-soon">Coming soon</span>
          </label>

          <label class="ride-option disabled">
            <input type="radio" name="ride-type" value="mini-bus" disabled />
            <span class="option-label">Mini Bus</span>
            <span class="coming-soon">Coming soon</span>
          </label>

          <label class="ride-option disabled">
            <input type="radio" name="ride-type" value="escort" disabled />
            <span class="option-label">Book Escort</span>
            <span class="coming-soon">Coming soon</span>
          </label>
        </div>

        <form id="booking-form" class="booking-form">
          <div class="field-row">
            <label for="pickup">Pickup</label>
            <input id="pickup" name="pickup" type="text" placeholder="Type a pickup location" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pickup-suggestions" autocomplete="off" required />
            <div id="pickup-suggestions" class="location-suggestions" role="listbox" aria-label="Pickup location suggestions" hidden></div>
          </div>

          <div class="field-row">
            <label for="destination">Destination</label>
            <input id="destination" name="destination" type="text" placeholder="Type a destination" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="destination-suggestions" autocomplete="off" required />
            <div id="destination-suggestions" class="location-suggestions" role="listbox" aria-label="Destination suggestions" hidden></div>
          </div>

          <fieldset class="timing-options">
            <legend>When do you need your ride?</legend>
            <label class="timing-choice">
              <input type="radio" name="timing" value="now" checked />
              <span>Ride now</span>
            </label>
            <label class="timing-choice">
              <input type="radio" name="timing" value="scheduled" />
              <span>Schedule for later</span>
            </label>
          </fieldset>

          <div id="scheduled-fields" class="field-row scheduled-fields" hidden>
            <label for="scheduled-at">Pickup date and time</label>
            <input id="scheduled-at" name="scheduledAt" type="datetime-local" />
          </div>

          <div class="field-row">
            <label for="passengers">Passengers</label>
            <select id="passengers" name="passengers" required>
              <option value="1" selected>1 passenger</option>
              <option value="2">2 passengers</option>
              <option value="3">3 passengers</option>
            </select>
          </div>

          <div class="field-row">
            <label for="payment-method">Payment method</label>
            <select id="payment-method" name="paymentMethod">
              <option value="cash" selected>Cash</option>
              <option value="transfer">Bank transfer</option>
            </select>
          </div>

          <section class="fare-total" aria-labelledby="fare-title">
            <div class="fare-heading">
              <div>
                <span class="fare-caption">Fare estimate</span>
                <h2 id="fare-title">Your fare</h2>
              </div>
              <strong id="fare-total">—</strong>
            </div>
            <dl id="fare-breakdown" class="fare-breakdown" aria-live="polite">
              <div><dt>Base fare</dt><dd>Choose a route</dd></div>
            </dl>
            <p id="fare-note" class="fare-note">Demo fare estimate. Final fare is shown before you confirm.</p>
          </section>

          <p id="booking-error" class="booking-message error-message" role="alert" hidden></p>
          <p id="booking-status" class="booking-message status-message" role="status" aria-live="polite" hidden></p>

          <button id="find-ride" type="submit" class="btn btn-primary btn-large">Find a ride</button>
        </form>

        <section id="match-card" class="match-card" aria-labelledby="match-title" hidden>
          <span class="match-badge">Driver found</span>
          <h2 id="match-title">Your keke is matched</h2>
          <p id="match-details"></p>
        </section>
      </section>

      <section class="map-panel" aria-label="Demo route map">
        <div class="map-card">
          <div class="map-header">
            <span class="map-badge">Demo map</span>
            <span id="map-route-label">Choose your route</span>
          </div>

          <div class="map-surface" aria-hidden="true">
            <div class="road road-h road-1"></div>
            <div class="road road-v road-2"></div>
            <div class="road road-h road-3"></div>
            <div class="road road-v road-4"></div>
            <div class="grid-line grid-1"></div>
            <div class="grid-line grid-2"></div>
            <div class="grid-line grid-3"></div>
            <div class="grid-line grid-4"></div>

            <div class="route-line route-a"></div>
            <div class="route-line route-b"></div>

            <div class="map-pin pickup-pin">A</div>
            <div class="map-pin destination-pin">B</div>
            <div class="map-label pickup-label">Pickup</div>
            <div class="map-label destination-label">Destination</div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
