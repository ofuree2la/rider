<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16824b" />
    <title>Activity | Rider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/history.css?v=activity-vehicle-art" />
    <link rel="stylesheet" href="css/vehicle-art.css?v=vehicle-art-everywhere" />
    <link rel="stylesheet" href="css/cancellation.css" />
    <link rel="stylesheet" href="css/bottom-nav.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <script type="module" src="js/history.js?v=vehicle-art-everywhere"></script>
    <script src="js/bottom-nav.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js" defer></script>
    <script src="js/motion.js" defer></script>
  </head>
  <body class="journey-body">
    <header class="journey-header">
      <div class="container journey-header-inner">
        <a href="index.html" class="brand" aria-label="Rider home page">
          <span class="brand-mark">R</span>
          <span class="brand-text">Rider</span>
        </a>
        <nav class="journey-nav" aria-label="Ride navigation">
          <a href="book.html">Book a ride</a>
          <a href="history.html" aria-current="page">Activity</a>
          <a href="profile.html">Profile</a>
        </nav>
      </div>
    </header>

    <main class="container journey-shell history-shell">
      <div class="page-heading activity-heading">
        <span class="eyebrow accent">Your trips</span>
        <h1>Activity</h1>
        <p>Your rides, all in one place.</p>
      </div>

      <div id="history-status" class="history-notice" role="status" aria-live="polite" hidden></div>
      <div id="history-error" class="history-error" role="alert" hidden>
        <p id="history-error-message">Your activity could not be loaded.</p>
        <button id="history-retry" class="btn btn-secondary" type="button">Retry</button>
      </div>

      <section class="activity-panel" aria-label="Ride activity">
        <div class="activity-toolbar">
          <div class="activity-filters" role="group" aria-label="Filter rides">
            <button type="button" class="activity-filter" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="activity-filter" data-filter="completed" aria-pressed="false">Completed</button>
            <button type="button" class="activity-filter" data-filter="cancelled" aria-pressed="false">Cancelled</button>
            <button type="button" class="activity-filter" data-filter="scheduled" aria-pressed="false">Scheduled</button>
          </div>
          <p id="activity-count" class="activity-count" aria-live="polite"></p>
        </div>

        <div id="history-loading" class="activity-skeleton-list" role="status" aria-live="polite" aria-label="Loading ride activity">
          <div class="activity-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
          <div class="activity-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
          <div class="activity-skeleton" aria-hidden="true"><span></span><i></i><i></i></div>
        </div>
        <div id="activity-empty" class="activity-empty" hidden>
          <span class="activity-empty-icon" aria-hidden="true">↗</span>
          <h2 id="activity-empty-title">No rides yet</h2>
          <p id="activity-empty-message">Your trips will show up here after you book a ride.</p>
          <a class="btn btn-primary" href="book.html">Book a ride</a>
        </div>
        <div id="activity-groups" class="activity-groups" aria-live="polite" hidden></div>
        <button id="activity-load-more" class="activity-load-more" type="button" hidden>Load more</button>
      </section>
    </main>
  </body>
</html>
