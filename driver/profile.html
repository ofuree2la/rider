<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16824b" />
    <title>Driver Profile | Rider Driver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css?v=bell-alerts-20261108" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/profile.css" />
    <link rel="stylesheet" href="../css/driver.css?v=bell-alerts-20261108" />
    <link rel="stylesheet" href="../css/bottom-nav.css" />
    <link rel="stylesheet" href="../css/mobile.css" />
    <script type="module" src="../js/driver-notifications.js?v=bell-alerts-20261108"></script>
    <script type="module" src="../js/profile.js?v=bell-alerts-20261108"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js" defer></script>
    <script src="../js/motion.js" defer></script>
  </head>
  <body class="profile-body has-bottom-nav" data-account-role="driver">
    <header class="site-header">
      <div class="container nav-shell">
        <a href="../index.html" class="brand" aria-label="Rider home page">
          <span class="brand-mark">R</span>
          <span class="brand-text">Rider Driver</span>
        </a>
        <nav class="site-nav profile-nav" aria-label="Driver navigation">
          <a href="dashboard.html">Dashboard</a>
          <a href="trips.html">Trips</a>
          <a href="earnings.html">Earnings</a>
          <a href="profile.html" aria-current="page">Profile</a>
        </nav>
        <button id="logout-button" class="btn btn-ghost" type="button">Log out</button>
      </div>
    </header>

    <main class="container profile-shell">
      <section class="profile-card-shell" aria-labelledby="profile-title">
        <span class="eyebrow accent">Rider Driver account</span>
        <h1 id="profile-title">Driver profile</h1>
        <p>Keep your contact, vehicle, and profile photo up to date.</p>

        <p id="profile-message" class="auth-message" role="status" aria-live="polite" hidden></p>

        <form id="profile-form" class="auth-form">
          <div class="profile-photo-control">
            <div class="profile-photo-frame">
              <img id="profile-photo" alt="Your profile photo" hidden />
              <span id="profile-photo-initials" aria-hidden="true">R</span>
            </div>
            <div class="field">
              <label for="profile-photo-input">Profile photo</label>
              <input id="profile-photo-input" name="profilePhoto" type="file" accept="image/jpeg,image/png,image/webp" />
              <small>JPG, PNG, or WebP; maximum 5 MB. Other signed-in users can view your photo.</small>
            </div>
          </div>
          <div class="field">
            <label for="profile-name">Full name</label>
            <input id="profile-name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="profile-email">Email</label>
            <input id="profile-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="profile-phone">Phone number</label>
            <input id="profile-phone" name="phone" type="tel" autocomplete="tel" required />
          </div>
          <div class="field">
            <label for="profile-vehicle">Vehicle type</label>
            <input id="profile-vehicle" name="vehicleType" type="text" readonly />
          </div>
          <div class="field">
            <label for="profile-plate">Vehicle registration / plate number</label>
            <input id="profile-plate" name="plateNumber" type="text" autocomplete="off" required />
          </div>
          <button class="btn btn-primary btn-large" type="submit">Save profile</button>
        </form>
      </section>
    </main>

    <nav class="bottom-nav driver-bottom-nav" aria-label="Driver dashboard navigation">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="trips.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/><circle cx="7" cy="6.5" r="1.5"/><circle cx="17" cy="12" r="1.5"/><circle cx="9" cy="17.5" r="1.5"/></svg>
        <span>Trips</span>
      </a>
      <a href="earnings.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16M6.5 16V10m5.5 6V5m5.5 11v-4"/></svg>
        <span>Earnings</span>
      </a>
      <a href="profile.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.7-3.5 3.2-5.5 7.5-5.5s6.8 2 7.5 5.5"/></svg>
        <span>Profile</span>
      </a>
    </nav>
  </body>
</html>
