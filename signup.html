<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | Rider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <span class="eyebrow accent">Rider</span>
      <h1>Create your account</h1>
      <p>Get started with Rider.</p>

      <form class="auth-form" action="index.html">
        <div class="form-grid">
          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" placeholder="Enter your name" />
          </div>

          <div class="field">
            <label for="role">Account type</label>
            <select id="role" name="role">
              <option value="student">Student</option>
              <option value="driver">Driver</option>
            </select>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="0803 000 0000" />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create password" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-large">Create account</button>
      </form>

      <p class="auth-note">Already have an account? <a href="login.html">Login</a></p>
    </main>
  </body>
</html>
