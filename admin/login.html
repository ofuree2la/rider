<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16824b" />
    <title>Rider Admin sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/mobile.css" />
    <script type="module" src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js" defer></script>
    <script src="../js/motion.js" defer></script>
  </head>
  <body class="auth-body" data-account-role="admin">
    <main class="auth-shell admin-auth-shell">
      <a class="eyebrow" href="../index.html">Rider Admin</a>
      <h1>Admin sign in</h1>
      <p>Manage driver access, campus locations, fare settings, and rides.</p>

      <form class="auth-form" data-auth-form data-auth-mode="login">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-large">Sign in to Admin</button>
      </form>

      <p id="auth-message" class="auth-message" role="alert" aria-live="polite" hidden></p>
      <p class="auth-note"><a href="../index.html">Back to Rider</a></p>
      <p class="admin-demo-note">Sign in with the Admin account provisioned in Supabase.</p>
    </main>
  </body>
</html>
