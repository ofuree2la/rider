<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student login | Rider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <script type="module" src="js/auth.js"></script>
  </head>
  <body class="auth-body" data-account-role="student">
    <main class="auth-shell">
      <span class="eyebrow accent">Rider</span>
      <h1>Welcome back</h1>
      <p>Sign in to continue booking campus rides.</p>

      <form class="auth-form" data-auth-form data-auth-mode="login">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-large">Login</button>
      </form>

      <p id="auth-message" class="auth-message" role="alert" aria-live="polite" hidden></p>
      <p class="auth-note">Need an account? <a href="signup.html">Create one</a></p>
      <p class="auth-note">Driving with Rider? <a href="driver/login.html">Rider Driver sign in</a></p>
    </main>
  </body>
</html>
